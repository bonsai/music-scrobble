name: Build music-scrobble

on:
  push:
    paths:
      - 'SKILLS/music-scrobble/**'
      - '.github/workflows/music-scrobble-build.yml'
  pull_request:
    paths:
      - 'SKILLS/music-scrobble/**'

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          check-latest: true

      - name: Build music-scrobble
        working-directory: SKILLS/music-scrobble
        run: |
          go mod tidy
          go build -o music-scrobble server.go
          ls -la music-scrobble || dir music-scrobble

      - name: Smoke test (Linux)
        if: runner.os == 'Linux'
        working-directory: SKILLS/music-scrobble
        run: |
          echo '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{}}' | timeout 3 ./music-scrobble 2>/dev/null | head -5 || true

      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        working-directory: SKILLS/music-scrobble
        shell: bash
        run: |
          echo '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{}}' | timeout 3 ./music-scrobble 2>/dev/null | head -5 || true

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: music-scrobble-${{ matrix.os }}
          path: SKILLS/music-scrobble/music-scrobble
          retention-days: 7